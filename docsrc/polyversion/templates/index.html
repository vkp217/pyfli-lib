<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PyFLI | Open-Source FLIM Analysis &amp; Fluorescence Lifetime Imaging in Python</title>
    <meta name="description" content="PyFLI is an open-source Python library for Fluorescence Lifetime Imaging Microscopy (FLIM) analysis: TCSPC and SPAD data processing, phasor plot analysis, NLSF/MLE lifetime fitting with IRF deconvolution, and FLIM data simulation for deep-learning model training." />
    <meta http-equiv="refresh" content="0; url=/{{ latest.name }}/" />
    <link rel="canonical" href="https://pyfli.org/{{ latest.name }}/" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 4rem auto;
            max-width: 28rem;
            text-align: center;
            color: #1a1a1a;
        }
        a { color: #2b7cff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        ul { list-style: none; padding: 0; margin-top: 1.5rem; }
        li { margin: 0.4rem 0; }
    </style>
</head>
<body>
    <p>Redirecting to the <a href="/{{ latest.name }}/">PyFLI documentation ({{ latest.name }})</a>&hellip;</p>
    <p>Available versions:</p>
    <ul>
    {% for rev in revisions %}
        <li><a href="/{{ rev.name }}/">{{ rev.name }}</a></li>
    {% endfor %}
    </ul>
</body>
</html>
